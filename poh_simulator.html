<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123c3a">
<title>POH Simulator</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#172d2b;--muted:#627572;--line:#dce6e3;--green:#176b5b;--green2:#e5f4ef;--amber:#fff3d8;--red:#a92c2c;--shadow:0 4px 16px #163d3510}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #6db8a7;outline-offset:2px}
.top{background:linear-gradient(115deg,#123c3a,#1b6557);color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #123c3a22}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:19px;font-weight:800;letter-spacing:-.4px}.subbrand{font-size:12px;opacity:.78;margin-top:2px}.shift{font-size:11px;border:1px solid #ffffff4d;border-radius:99px;padding:5px 8px;white-space:nowrap}
main{max-width:720px;margin:auto;padding:15px 13px 90px}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:3px 2px 13px}.eyebrow{text-transform:uppercase;letter-spacing:1px;color:var(--green);font-size:10px;font-weight:800}.h1{font-size:24px;letter-spacing:-.7px;font-weight:800;margin:2px 0}.muted{color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:750;background:#edf2f0;color:#415653}.pill.green{background:var(--green2);color:#176b5b}.pill.amber{background:var(--amber);color:#825c0a}.pill.red{background:#fde8e8;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:13px}.statlabel{font-size:11px;color:var(--muted);font-weight:650}.statval{font-size:24px;font-weight:850;letter-spacing:-.6px;margin:4px 0 0}.statfoot{font-size:11px;color:var(--muted);margin-top:2px}.card{padding:15px;margin-top:12px}.cardtitle{font-weight:800;font-size:15px;margin-bottom:8px}.sectionrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.divider{height:1px;background:var(--line);margin:12px 0}
.patient{display:flex;gap:12px;align-items:flex-start}.avatar{height:50px;width:50px;flex:0 0 50px;border-radius:15px;background:#e0efea;color:#155e51;display:grid;place-items:center;font-weight:850;font-size:18px}.patientname{font-weight:800;font-size:17px}.small{font-size:12px;color:var(--muted)}.actionlist{display:grid;gap:8px}.action{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;display:flex;align-items:center;gap:10px;color:var(--ink)}.action:active{transform:scale(.995)}.action.selected{border-color:var(--green);background:var(--green2)}.actionicon{width:34px;height:34px;border-radius:10px;background:#edf4f1;display:grid;place-items:center;font-size:17px;flex:0 0 34px}.actiontext{flex:1}.actiontitle{font-weight:750;font-size:13px}.actiondesc{font-size:11px;color:var(--muted);margin-top:2px}.arrow{font-size:20px;color:#6a817b}.btn{border:0;background:var(--green);color:#fff;padding:12px 15px;border-radius:12px;font-weight:800;width:100%;box-shadow:0 3px 8px #176b5b20}.btn.secondary{background:#edf3f1;color:#254641;box-shadow:none;border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--green);box-shadow:none;border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.metricgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#f6f8f7;border:1px solid #e6edeb;border-radius:12px;padding:11px}.metriclabel{font-size:11px;color:var(--muted)}.metricvalue{font-size:19px;font-weight:850;margin-top:2px}.metricunit{font-size:10px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:auto}.navbtn{border:0;background:transparent;color:#748681;border-radius:12px;padding:6px 2px;font-size:10px;font-weight:750;display:grid;justify-items:center;gap:3px}.navbtn .ni{font-size:20px;line-height:1.1}.navbtn.active{background:var(--green2);color:var(--green)}
.notice{border-radius:12px;padding:12px;font-size:13px;background:#eef5f2;border:1px solid #d4e8df}.notice.warn{background:#fff5df;border-color:#f1ddb0}.notice.danger{background:#fff0f0;border-color:#f0c8c8}.feedback{border-left:4px solid var(--green);background:#f0f7f4;padding:12px;border-radius:0 12px 12px 0;font-size:13px;margin-top:10px}.choice{border:1px solid var(--line);background:white;border-radius:12px;padding:12px;text-align:left;width:100%;font-size:13px;margin:0 0 8px;color:var(--ink)}.choice strong{display:block;margin-bottom:4px}.choice.chosen{border-color:var(--green);background:var(--green2)}.choice:disabled{cursor:default}.choice.correct{border-color:#16845d;background:#e7f7ef}.choice.wrong{border-color:#c94d4d;background:#fff0f0}.progress{height:7px;background:#e5ece9;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#25856e;border-radius:99px;width:0;transition:width .25s}.logitem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.logitem:last-child{border-bottom:0}.dot{height:9px;width:9px;background:#398a74;border-radius:50%;margin-top:5px;flex:0 0 9px}.hidden{display:none!important}.footerhint{text-align:center;color:var(--muted);font-size:10px;margin:18px 10px}
@media(min-width:560px){main{padding:20px 18px 100px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.statval{font-size:23px}.metricgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top"><div class="toprow"><div><div class="brand">✚ POH Simulator</div><div class="subbrand">Huisartsenpraktijk De Linde · Opleidingsmodus</div></div><div class="shift" id="clock">MA · 08:15</div></div></header>
<main id="app"></main>
<nav class="nav" aria-label="Hoofdnavigatie">
<button class="navbtn active" data-tab="home"><span class="ni">⌂</span>Overzicht</button>
<button class="navbtn" data-tab="patients"><span class="ni">♙</span>Patiënten</button>
<button class="navbtn" data-tab="consult"><span class="ni">▤</span>Consult</button>
<button class="navbtn" data-tab="career"><span class="ni">↗</span>Carrière</button>
</nav>
<script>
const state={tab:"home",xp:0,trust:50,done:0,day:1,clock:15,patientIndex:0,actions:[],history:[],consultStep:0,selected:null,feedback:null,caseStatus:"open",skills:{Anamnese:0,"Klinisch redeneren":0,"Veiligheid & triage":0,"Samenwerken":0},notes:[]};
const cases=[
{id:"P-10482",name:"De heer Jansen",age:58,initials:"HJ",problem:"Diabetes mellitus type 2",appointment:"Diabetescontrole",status:"In consult",intro:"Ik ben de laatste tijd erg moe. Ik heb ook meer dorst en moet vaker plassen.",history:"DM2 · metformine · laatste HbA1c 53 mmol/mol",vitals:[["Glucose","22,4","mmol/L"],["Pols","104","/min"],["Bloeddruk","108/70","mmHg"],["Ademhaling","20","/min"]]},
{id:"P-10511",name:"Mevrouw Bakker",age:64,initials:"MB",problem:"Hypertensie",appointment:"Bloeddrukcontrole",status:"Gepland",intro:"Ik heb thuis een paar keer een hogere bloeddruk gemeten.",history:"Hypertensie · controle gepland",vitals:[["Bloeddruk","156/94","mmHg"],["Pols","78","/min"]]},
{id:"P-10536",name:"De heer Visser",age:71,initials:"JV",problem:"CVRM-controle",appointment:"Cardiovasculair risicomanagement",status:"Gepland",intro:"Ik wil weten hoe het met mijn cholesterol en risico zit.",history:"CVRM · statine volgens dossier",vitals:[["LDL","2,4","mmol/L"],["Bloeddruk","142/86","mmHg"]]}
];
const patient=()=>cases[state.patientIndex];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shellHead(kicker,title,sub="",pill=""){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><div class="h1">${title}</div>${sub?`<div class="muted">${sub}</div>`:""}</div>${pill?`<span class="pill ${pill.includes("Actief")?"green":""}">${pill}</span>`:""}</div>`}
function stat(label,val,foot=""){return `<div class="stat"><div class="statlabel">${label}</div><div class="statval">${val}</div><div class="statfoot">${foot}</div></div>`}
function card(title,body,right=""){return `<section class="card"><div class="sectionrow"><div class="cardtitle">${title}</div>${right}</div>${body}</section>`}
function patientCard(p,idx){return `<section class="card"><div class="patient"><div class="avatar">${p.initials}</div><div style="flex:1"><div class="sectionrow"><div class="patientname">${p.name}</div><span class="pill ${idx===state.patientIndex?"green":""}">${p.status}</span></div><div class="small">${p.age} jaar · ${p.problem}</div><div style="margin-top:7px;font-size:13px">${p.appointment}</div><div class="small" style="margin-top:4px">Dossier ${p.id}</div></div></div><div class="twobtn"><button class="btn secondary" onclick="openPatient(${idx})">Dossier openen</button><button class="btn" onclick="startConsult(${idx})">Start consult</button></div></section>`}
function renderHome(){return shellHead("MAANDAG · DAG 1","Goedemorgen, POH","Je eerste spreekuur staat klaar.","Carrière gestart")+`<div class="grid">${stat("Ervaring",state.xp+" XP","Volgende niveau bij 100 XP")}${stat("Patiënten afgerond",state.done,"Vandaag")}${stat("Vertrouwen huisarts",state.trust+"/100","Samenwerking")}${stat("Werkdag","08:"+String(state.clock).padStart(2,"0"),"Spreekuurtijd")}</div>`+
card("Dagplanning",`<div class="logitem"><div class="dot"></div><div><b>08:15 · Diabetescontrole</b><div class="small">De heer Jansen · In consult</div></div><span class="pill amber">Prioriteit</span></div><div class="logitem"><div class="dot" style="background:#b7c8c2"></div><div><b>09:00 · Bloeddrukcontrole</b><div class="small">Mevrouw Bakker</div></div></div><div class="logitem"><div class="dot" style="background:#b7c8c2"></div><div><b>09:30 · CVRM-controle</b><div class="small">De heer Visser</div></div></div>`,`<span class="pill">3 afspraken</span>`)+
card("Huidige patiënt",`<div class="patient"><div class="avatar">${patient().initials}</div><div><div class="patientname">${patient().name}</div><div class="small">${patient().age} jaar · ${patient().problem}</div><p style="font-size:13px;margin:8px 0 0">${patient().intro}</p></div></div><div class="twobtn"><button class="btn secondary" onclick="setTab('patients')">Patiëntendossiers</button><button class="btn" onclick="startConsult(${state.patientIndex})">Verder consult →</button></div>`)+
card("Carrièrevoortgang",`<div class="sectionrow"><b style="font-size:13px">Starter POH</b><span class="small">${state.xp}/100 XP</span></div><div class="progress" style="margin-top:8px"><div style="width:${Math.min(100,state.xp)}%"></div></div><div class="small" style="margin-top:8px">Verdien ervaring door veilig te handelen, informatie te verzamelen en goed samen te werken.</div>`)}
function renderPatients(){return shellHead("PATIËNTENLIJST","Patiëntendossiers","Fictieve casussen voor oefendoeleinden.")+cases.map((p,i)=>patientCard(p,i)).join("")+`<div class="footerhint">Alle patiëntgegevens in deze game zijn fictief.</div>`}
function openPatient(idx){state.patientIndex=idx;state.tab="patients";render();let el=document.getElementById("detail");if(el)el.scrollIntoView({behavior:"smooth"});}
function renderConsult(){const p=patient();let intro=card("Hulpvraag",`<div class="patient"><div class="avatar">${p.initials}</div><div><div class="patientname">${p.name}</div><div class="small">${p.age} jaar · ${p.problem} · Dossier ${p.id}</div><p style="font-size:14px;margin:9px 0 0">“${p.intro}”</p></div></div><div class="divider"></div><div class="small"><b>Relevante voorgeschiedenis</b><br>${p.history}</div>`);
let actions=card("Consultacties",`<div class="actionlist">
<button class="action" onclick="doAction('anamnese')"><span class="actionicon">☷</span><span class="actiontext"><span class="actiontitle">Gericht doorvragen</span><br><span class="actiondesc">Klachten, duur, ernst en alarmsymptomen</span></span><span class="arrow">›</span></button>
<button class="action" onclick="doAction('metingen')"><span class="actionicon">♥</span><span class="actiontext"><span class="actiontitle">Meetwaarden bekijken</span><br><span class="actiondesc">Vitale parameters en glucose</span></span><span class="arrow">›</span></button>
<button class="action" onclick="doAction('dossier')"><span class="actionicon">▤</span><span class="actiontext"><span class="actiontitle">Dossier en medicatie</span><br><span class="actiondesc">Voorgeschiedenis en therapietrouw</span></span><span class="arrow">›</span></button>
<button class="action" onclick="doAction('overleg')"><span class="actionicon">♧</span><span class="actiontext"><span class="actiontitle">Overleg huisarts</span><br><span class="actiondesc">Bespreek afwijkende bevindingen</span></span><span class="arrow">›</span></button>
</div>`);
let found=state.actions.length?card("Verzamelde informatie",state.actions.map(a=>`<div class="logitem"><div class="dot"></div><div><b>${esc(a.title)}</b><div class="small">${esc(a.text)}</div></div></div>`).join("")):"";
let decision="";
if(state.actions.some(a=>a.id==="anamnese")&&state.actions.some(a=>a.id==="metingen")&&!state.feedback){
decision=card("Beslismoment",`<p style="font-size:13px;margin-top:0">Je hebt meer dorst, vaker plassen, vermoeidheid en een glucose van 22,4 mmol/L vastgesteld. Wat is je volgende stap als POH in opleiding?</p>
<button class="choice ${state.selected==="A"?"chosen":""}" onclick="selectChoice('A')"><strong>A. Direct overleggen met de huisarts</strong>Geef de bevindingen door en bespreek de benodigde acute beoordeling.</button>
<button class="choice ${state.selected==="B"?"chosen":""}" onclick="selectChoice('B')"><strong>B. Alleen HbA1c aanvragen</strong>Plan de verdere controle over enkele dagen.</button>
<button class="choice ${state.selected==="C"?"chosen":""}" onclick="selectChoice('C')"><strong>C. Zelf de medicatie verhogen</strong>Pas de metforminedosis direct aan.</button>
<button class="choice ${state.selected==="D"?"chosen":""}" onclick="selectChoice('D')"><strong>D. Leefstijladvies geven</strong>Rond het consult af met voedingsadvies.</button>
<button class="btn" style="margin-top:4px" ${!state.selected?"disabled":""} onclick="submitDecision()">Beslissing vastleggen</button>`);
}
if(state.feedback){decision=card("Terugkoppeling",`<div class="feedback">${state.feedback}</div><div class="twobtn"><button class="btn secondary" onclick="resetDecision()">Opnieuw bekijken</button><button class="btn" onclick="nextCase()">Volgende stap →</button></div>`)}
return shellHead("CONSULTKAMER","Diabetescontrole","Dossier "+p.id,"Actief")+`<div class="notice warn"><b>Let op:</b> Dit is een oefencasus. Bij een echte patiënt bepalen de actuele toestand, praktijkprotocollen en huisartsbeoordeling het beleid.</div>`+intro+
(p.vitals?card("Meetwaarden",`<div class="metricgrid">${p.vitals.map(v=>`<div class="metric"><div class="metriclabel">${v[0]}</div><div class="metricvalue">${v[1]}</div><div class="metricunit">${v[2]}</div></div>`).join("")}</div>`):"")+actions+found+decision}
function renderCareer(){let skills=Object.entries(state.skills);return shellHead("OPLEIDING","Jouw carrière","Bouw vaardigheden op door veilige keuzes te maken.")+`<div class="grid">${stat("Totale ervaring",state.xp+" XP","Van maximaal 100 XP voor niveau 2")}${stat("Huisartsvertrouwen",state.trust+"/100","Gebaseerd op samenwerking")}</div>`+card("Ontwikkelvaardigheden",skills.map(([k,v])=>`<div style="margin:12px 0"><div class="sectionrow"><b style="font-size:13px">${k}</b><span class="small">${v} punten</span></div><div class="progress" style="margin-top:6px"><div style="width:${Math.min(100,v*10)}%"></div></div></div>`).join(""))+card("Persoonlijk logboek",state.notes.length?state.notes.map(n=>`<div class="logitem"><div class="dot"></div><div><b>${esc(n.title)}</b><div class="small">${esc(n.body)}</div></div></div>`).join(""):`<div class="muted">Je beslissingen en leermomenten verschijnen hier zodra je consultacties uitvoert.`)+`<button class="btn ghost" style="margin-top:12px" onclick="resetGame()">Carrière opnieuw starten</button>`}
function render(){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));let app=document.getElementById("app");app.innerHTML=state.tab==="home"?renderHome():state.tab==="patients"?renderPatients():state.tab==="consult"?renderConsult():renderCareer();document.getElementById("clock").textContent="MA · "+(8+Math.floor(state.clock/60))+":"+String(state.clock%60).padStart(2,"0")}
function setTab(t){state.tab=t;render()}
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
function startConsult(idx){state.patientIndex=idx;state.tab="consult";state.caseStatus="open";render()}
function doAction(id){if(state.actions.some(a=>a.id===id))return;let a;
if(id==="anamnese"){a={id,title:"Gerichte anamnese",text:"Vermoeidheid sinds 6 weken, meer dorst en polyurie. Geen braken of buikpijn gemeld."};state.skills.Anamnese+=1;}
if(id==="metingen"){a={id,title:"Meetwaarden",text:"Glucose 22,4 mmol/L, pols 104/min, bloeddruk 108/70 mmHg, ademhaling 20/min."};state.skills["Klinisch redeneren"]+=1;}
if(id==="dossier"){a={id,title:"Dossier nagekeken",text:"DM2 en metformine; eerdere HbA1c 53 mmol/mol. Medicatie-inname vraagt verdere verificatie."};state.skills.Anamnese+=1;}
if(id==="overleg"){a={id,title:"Overleg huisarts",text:"Huisarts wordt geïnformeerd over hyperglykemie, klachten en vitale parameters."};state.skills["Samenwerken"]+=1;state.trust=Math.min(100,state.trust+4);if(!state.xp)state.xp+=5;state.notes.unshift({title:"Tijdig overleg",body:"Afwijkende waarden veilig overgedragen aan de huisarts."});}
state.actions.push(a);state.clock+=5;render()}
function selectChoice(c){state.selected=c;render()}
function submitDecision(){if(!state.selected)return;let msg="",gain=0;
if(state.selected==="A"){msg="<b>Goede keuze.</b> De combinatie van forse hyperglykemie en klachten vraagt om directe beoordeling door de huisarts. Je draagt de bevindingen gestructureerd over; verdere diagnostiek en behandelbesluiten volgen door de bevoegde behandelaar.";gain=20;state.trust=Math.min(100,state.trust+8);state.skills["Veiligheid & triage"]+=2;state.skills["Samenwerken"]+=1;state.notes.unshift({title:"Veilig opgeschaald",body:"Bij symptomatische glucose 22,4 mmol/L direct overlegd; niet gewacht op HbA1c."});}
else if(state.selected==="B"){msg="<b>Onvoldoende veilig.</b> HbA1c beschrijft de gemiddelde glucose over langere tijd en sluit acute ontregeling niet uit. De combinatie van klachten en glucose 22,4 mmol/L vraagt nu om medische beoordeling; plan dit niet pas later.";gain=0;state.trust=Math.max(0,state.trust-4);state.skills["Veiligheid & triage"]+=0;}
else if(state.selected==="C"){msg="<b>Niet passend bij je rol.</b> Een POH in opleiding past niet zelfstandig de medicatie aan. De huisarts moet de acute situatie en eventuele behandeling beoordelen. Overleg nu alsnog direct.";gain=0;state.trust=Math.max(0,state.trust-6);}
else{msg="<b>Onvoldoende veilig.</b> Leefstijladvies is op dit moment niet de prioriteit. Eerst moet de huisarts de symptomatische hyperglykemie en mogelijke dehydratie beoordelen.";gain=0;state.trust=Math.max(0,state.trust-5);}
state.xp=Math.min(100,state.xp+gain);state.done=state.selected==="A"?1:0;state.feedback=msg;state.clock+=10;render()}
function resetDecision(){state.feedback=null;state.selected=null;render()}
function nextCase(){if(state.selected==="A"){state.feedback="<b>Uitkomst:</b> De huisarts beoordeelt meneer dezelfde dag en bepaalt verdere diagnostiek en behandeling. Na stabilisatie volgt een gepland diabetesconsult bij jou. Je hebt deze acute situatie veilig herkend.";state.notes.unshift({title:"Consult afgerond",body:"De acute beoordeling is overgedragen; chronische follow-up volgt na stabilisatie."});}else{state.feedback="<b>Herstelactie:</b> Je herkent dat eerst medische beoordeling nodig is. Neem alsnog direct contact op met de huisarts en draag de actuele klachten en metingen over.";state.trust=Math.min(100,state.trust+1);}state.tab="career";render()}
function resetGame(){if(confirm("Wil je je carrière en voortgang opnieuw starten?")){Object.assign(state,{tab:"home",xp:0,trust:50,done:0,day:1,clock:15,patientIndex:0,actions:[],history:[],consultStep:0,selected:null,feedback:null,caseStatus:"open",skills:{Anamnese:0,"Klinisch redeneren":0,"Veiligheid & triage":0,"Samenwerken":0},notes:[]});render()}}
render();
</script>
</body>
</html>
